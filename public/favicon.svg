<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="walletGrad" x1="8" y1="16" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="32" y1="24" x2="54" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Icon Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Card Peek inside Wallet -->
  <rect x="15" y="11" width="34" height="15" rx="3.5" fill="#38bdf8" opacity="0.9" />

  <!-- Wallet Body Shell -->
  <rect x="8" y="19" width="48" height="34" rx="7" fill="url(#walletGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Flap / Pocket Seam -->
  <path d="M8 33 L32 41 L56 33" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Golden Rupee Coin -->
  <g filter="url(#shadow)">
    <circle cx="43" cy="34" r="10" fill="url(#coinGrad)" stroke="#ffffff" stroke-width="1.5" />
    <text x="43" y="39.2" text-anchor="middle" fill="#713f12" font-size="12" font-weight="900" font-family="system-ui, -apple-system, sans-serif">₹</text>
  </g>
</svg>
